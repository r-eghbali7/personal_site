<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ lesson.title }} | {{ course.title }}</title>
    <style>
      body { margin: 0; background: #f4f6f5; color: #202b29; font: 16px/1.8 sans-serif; }
      main { max-width: 960px; margin: 40px auto; padding: 24px; }
      section { background: white; border: 1px solid #dce4e0; border-radius: 8px; padding: 24px; }
      video { width: 100%; max-height: 65vh; background: #17231f; }
      a { color: #075d4f; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="{% url 'courses:detail' course.slug %}">{{ course.title }}</a></p>
      <section>
        <h1>{{ lesson.title }}</h1>
        {% if lesson.video_file %}<video controls preload="metadata" src="{{ lesson.video_file.url }}"></video>
        {% elif lesson.video_url %}<p><a href="{{ lesson.video_url }}" target="_blank" rel="noopener noreferrer">مشاهده ویدئوی درس</a></p>
        {% else %}<p>برای این درس هنوز ویدئویی بارگذاری نشده است.</p>{% endif %}
        {% if lesson.attachment %}<p><a href="{{ lesson.attachment.url }}">دریافت فایل پیوست</a></p>{% endif %}
      </section>
    </main>
  </body>
</html>
