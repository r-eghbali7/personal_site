<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تکمیل سفارش</title>
    <style>
      body { margin: 0; background: #f4f6f5; color: #202b29; font: 16px/1.8 sans-serif; }
      main { max-width: 700px; margin: 48px auto; padding: 24px; background: white; border: 1px solid #dce4e0; border-radius: 8px; }
      li { margin: 10px 0; }
      button { margin-top: 20px; background: #075d4f; border: 0; border-radius: 6px; color: white; padding: 10px 18px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>تکمیل سفارش</h1>
      {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      <ul>{% for item in items %}<li>{{ item.course.title }} · {{ item.course.price|floatformat:0 }} تومان</li>{% endfor %}</ul>
      <p><strong>مبلغ کل: {{ total|floatformat:0 }} تومان</strong></p>
      <form method="post" action="{% url 'orders:payment_request' %}">{% csrf_token %}<button type="submit">انتقال به درگاه پرداخت</button></form>
      <p><a href="{% url 'orders:cart' %}">بازگشت به سبد خرید</a></p>
    </main>
  </body>
</html>
