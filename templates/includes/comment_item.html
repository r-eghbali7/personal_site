{% load persian_filters %}
<div class="rounded-xl bg-surface-container-low p-3">
  <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-outline">
    <span class="font-semibold text-on-surface">{{ comment.user.full_name|default:"کاربر آکادمی" }}</span>
    <span>{{ comment.created_at|persian_date:"%Y %B %d" }}</span>
  </div>
  <p class="mt-1.5 text-body-sm leading-6 text-on-surface-variant">{{ comment.body|linebreaksbr }}</p>
</div>
