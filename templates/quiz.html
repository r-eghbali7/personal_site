<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ quiz.title }}</title>
    <style>
      body { margin: 0; background: #f4f6f5; color: #202b29; font: 16px/1.8 sans-serif; }
      main { max-width: 800px; margin: 40px auto; padding: 24px; }
      fieldset { background: white; border: 1px solid #dce4e0; border-radius: 8px; margin: 14px 0; padding: 18px; }
      label { display: block; padding: 6px 0; }
      button { background: #075d4f; border: 0; border-radius: 6px; color: white; padding: 10px 18px; font: inherit; cursor: pointer; }
      #result { margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="{% url 'courses:detail' quiz.chapter.course.slug %}">{{ quiz.chapter.course.title }}</a></p>
      <h1>{{ quiz.title }}</h1>
      <form id="quiz-form">{% csrf_token %}
        {% for question in questions %}
        <fieldset><legend>{{ question.body }}</legend>
          {% for choice in question.choices.all %}
          <label><input type="radio" name="question-{{ question.id }}" value="{{ choice.id }}" /> {{ choice.text }}</label>
          {% endfor %}
        </fieldset>
        {% empty %}<p>این آزمون هنوز پرسشی ندارد.</p>{% endfor %}
        {% if questions %}<button type="submit">ثبت پاسخ‌ها</button>{% endif %}
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById('quiz-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const answers = {};
        form.querySelectorAll('input[type="radio"]:checked').forEach((input) => {
          answers[input.name.replace('question-', '')] = input.value;
        });
        const response = await fetch("{% url 'courses:quiz_submit' quiz.id %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': form.querySelector('[name="csrfmiddlewaretoken"]').value,
          },
          body: JSON.stringify({ answers }),
        });
        const result = document.getElementById('result');
        if (!response.ok) {
          result.textContent = 'ثبت پاسخ‌ها انجام نشد. دوباره تلاش کنید.';
          return;
        }
        const data = await response.json();
        result.textContent = `نمره: ${data.score} از ۱۰۰ · ${data.passed ? 'قبول شدید' : 'نیاز به تلاش دوباره'}`;
      });
    </script>
  </body>
</html>
